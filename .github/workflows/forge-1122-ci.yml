name: Forge 1.12.2 - Build and QA

on:
  workflow_dispatch:
  push:
    branches: [main, dev/watcher-dual-voice-tree, dev/tree-30-atmosphere-v028, dev/tree-sealed-watcher-cinematic-v028, dev/early-days-watcher-stalking-v029]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'tools/**'
      - '.github/workflows/forge-1122-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Environment details
        run: |
          java -version
          javac -version
      - name: Check source tree
        run: |
          test -f build.gradle
          test -f src/main/java/br/veilchapter/VeilMod.java
          test -f tools/preparar_mdk.sh
          test -f tools/inspecao_estatica.py
          test -f tools/testar_logica_offline.sh
      - name: Static preflight
        run: python3 tools/inspecao_estatica.py | tee static_qa.log
      - name: Validate positional audio assets (OGG mono, decoding, SHA-256)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          ffprobe -version | head -n 1
          python3 tools/validar_audio.py 2>&1 | tee audio_qa.log
      - name: Offline logic tests
        run: bash tools/testar_logica_offline.sh | tee offline_qa.log
      - name: Watcher stalking static tests
        run: python3 tools/validar_stalking.py | tee stalking_qa.log
      - name: Prepare Gradle wrapper
        run: bash tools/preparar_mdk.sh
      - name: Compile and reobfuscate mod
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace clean build 2>&1 | tee build_log.txt
      - name: Watcher Spatial Voice checks (5 speeches x 3 environments)
        run: python3 tools/validar_watcher_spatial.py 2>&1 | tee watcher_spatial_qa.log
      - name: Inspect generated JAR
        shell: bash
        run: |
          set -euo pipefail
          jars=(build/libs/*.jar)
          [[ -f "${jars[0]}" ]] || { echo 'No JAR generated'; exit 1; }
          jar tf "${jars[0]}" | tee jar_contents.txt
          grep -qx 'br/veilchapter/VeilMod.class' jar_contents.txt
          grep -qx 'br/veilchapter/core/TreeRitualPacing.class' jar_contents.txt
          grep -qx 'mcmod.info' jar_contents.txt
          grep -qx 'assets/veilchapter/textures/entity/watcher.png' jar_contents.txt
          python3 - <<'PY'
          import json, zipfile, hashlib, pathlib
          jar=next(pathlib.Path("build/libs").glob("*.jar"))
          manifest=json.loads(pathlib.Path("AUDIO_QA_MANIFEST.json").read_text())
          with zipfile.ZipFile(jar) as z:
              members=set(z.namelist())
              assert "mcmod.info" in members
              assert "assets/veilchapter/sounds.json" in members
              assert "assets/veilchapter/textures/entity/watcher.png" in members
              for entry in manifest:
                  member=entry["file"].removeprefix("src/main/resources/")
                  assert member in members, member
                  assert hashlib.sha256(z.read(member)).hexdigest()==entry["sha256"], member
              actual=json.loads(z.read("assets/veilchapter/sounds.json"))
              assert {k:len(actual[k]["sounds"]) for k in ("psst","hey","laugh","breath")}=={"psst":5,"hey":4,"laugh":3,"breath":2}
          print("JAR_AUDIO_QA_PASS: all 14 legacy OGG assets intact and referenced.")
          PY
          python3 tools/validar_watcher_spatial.py --jar 2>&1 | tee watcher_spatial_jar_qa.log
      - name: Upload compiled JAR for media integration (NOT installable without 15 OGGs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilchapter-v0.2.8-INCOMPLETE-AUDIO-FOR-PACKAGING
          path: build/libs/*.jar
          if-no-files-found: ignore
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilchapter-build-diagnostics
          path: |
            build_log.txt
            static_qa.log
            offline_qa.log
            audio_qa.log
            watcher_spatial_qa.log
            stalking_qa.log
            watcher_spatial_jar_qa.log
            jar_contents.txt
          if-no-files-found: ignore
