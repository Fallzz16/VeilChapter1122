name: Minecraft 1.12.2 - Production Forge Server Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forge-production-smoke.yml'
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'tools/preparar_mdk.sh'

permissions:
  contents: read

jobs:
  production-server:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build and reobfuscate mod
        shell: bash
        run: |
          set -euo pipefail
          bash tools/preparar_mdk.sh
          ./gradlew --no-daemon clean build 2>&1 | tee compile_log.txt
          test -f build/libs/VeilChapter1122-0.2.4-alpha-internal.jar
      - name: Install official Forge production server
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$RUNNER_TEMP/veil-server"
          mkdir -p "$SERVER/mods"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 150 --silent --show-error \
            'https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2859/forge-1.12.2-14.23.5.2859-installer.jar' -o "$RUNNER_TEMP/forge-installer.jar"
          echo '6b3d5be8b58d5385fda9c4d285367f4cb6e697b2  '"$RUNNER_TEMP/forge-installer.jar" | sha1sum -c -
          ( cd "$SERVER" && java -jar "$RUNNER_TEMP/forge-installer.jar" --installServer ) 2>&1 | tee production_install_log.txt
          cp build/libs/VeilChapter1122-0.2.4-alpha-internal.jar "$SERVER/mods/"
          test -f "$SERVER/forge-1.12.2-14.23.5.2859.jar"
          printf 'eula=true\n' > "$SERVER/eula.txt"
      - name: Boot actual Forge production server
        shell: bash
        run: |
          set -u
          SERVER="$RUNNER_TEMP/veil-server"
          cd "$SERVER"
          java -Xms512M -Xmx2G -jar forge-1.12.2-14.23.5.2859.jar nogui > "$GITHUB_WORKSPACE/production_server_log.txt" 2>&1 &
          server_pid=$!
          booted=0
          for i in $(seq 1 180); do
            if grep -Eq 'Done \([0-9.]+s\)' "$GITHUB_WORKSPACE/production_server_log.txt" 2>/dev/null; then booted=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          tail -n 110 "$GITHUB_WORKSPACE/production_server_log.txt" || true
          kill -INT "$server_pid" 2>/dev/null || true
          if [ "$booted" -ne 1 ]; then
            echo 'PRODUCTION_SERVER_BOOT_FAILED: no ready message'
            exit 1
          fi
          if ! grep -i 'veilchapter' "$GITHUB_WORKSPACE/production_server_log.txt"; then
            echo 'PRODUCTION_SERVER_MISSING_MOD: ready state did not establish mod presence'
            exit 1
          fi
          echo 'PRODUCTION_FORGE_SERVER_BOOT_OK'
      - name: Save all build and production diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilchapter-production-server-diagnostics
          path: |
            compile_log.txt
            production_install_log.txt
            production_server_log.txt
          if-no-files-found: ignore
