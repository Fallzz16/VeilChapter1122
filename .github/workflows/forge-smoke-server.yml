name: Minecraft 1.12.2 - Dedicated Server Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forge-smoke-server.yml'
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'tools/preparar_mdk.sh'

permissions:
  contents: read

jobs:
  server-boot:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Prepare Gradle wrapper
        run: bash tools/preparar_mdk.sh
      - name: Boot Forge dedicated server in a disposable test world
        shell: bash
        run: |
          set -u
          mkdir -p run
          # Ephemeral CI test server only; no public listener or published world.
          printf 'eula=true\n' > run/eula.txt
          ./gradlew --no-daemon runServer > server_boot_log.txt 2>&1 &
          gradle_pid=$!
          booted=0
          for attempt in $(seq 1 240); do
            if grep -Eq 'Done \([0-9.]+s\)!|Done \([0-9.]+s\)' server_boot_log.txt 2>/dev/null; then
              booted=1
              break
            fi
            if ! kill -0 "$gradle_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          tail -n 100 server_boot_log.txt || true
          kill -INT "$gradle_pid" 2>/dev/null || true
          if [ "$booted" -eq 1 ]; then
            echo 'SERVER_BOOT_OK: Minecraft Forge reached the server ready message'
          else
            echo 'SERVER_BOOT_FAILED: server did not reach ready state in allotted time'
            exit 1
          fi
      - name: Save server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veilchapter-server-boot-diagnostics
          path: |
            server_boot_log.txt
            run/logs/**
            run/crash-reports/**
          if-no-files-found: ignore
