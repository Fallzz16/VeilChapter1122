// VEIL CHAPTER v0.2.7 - WATCHER SPATIAL VOICE (NEEDS CLIENT PLAYTEST).
// ForgeGradle 5.1.74 / Gradle 7.3.3, publicado oficialmente.
// Exige verificacao de userdev3 do Forge 2859 e um build real antes de entrega.
buildscript {
    repositories {
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:5.1.74'
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'idea'

version = '0.2.7-watcher-spatial'
group = 'br.veilchapter'
archivesBaseName = 'VeilChapter1122'
sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

minecraft {
    mappings channel: 'stable', version: '39-1.12'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.12.2'
    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': '1.12.2'
    }
}
jar.finalizedBy('reobfJar')
